# =============================================================================
# Environment configuration — DEV
# =============================================================================
# Override values from config/pipeline_config.yaml for the dev environment.
# The Airflow DAG selects this file based on the "env" parameter.
# Deployed to: gs://<artifacts-bucket>/pyspark_xml_etl/config/pipeline_config_dev.yaml
# =============================================================================

app_name: "XMLETLPipeline-DEV"
env: "dev"

gcp:
  project: "your-gcp-project-dev"
  region: "us-central1"
  dataproc_cluster: "xml-etl-dev"
  artifacts_bucket: "your-artifacts-bucket-dev"

source:
  path: "gs://your-source-bucket-dev/raw/xml/*.xml"
  row_tag: "record"
  reader_options:
    charset: "UTF-8"
    treatEmptyValuesAsNulls: "true"
    attributePrefix: "attr_"
    valueTag: "_value"

schema:
  path: "gs://your-artifacts-bucket-dev/pyspark_xml_etl/config/schema_config.json"

quality:
  max_corrupt_records: 500          # more lenient in dev for exploration

flatten_structs: true

pivot_specs:
  - array_col: teeth
    prefix: tooth_id
    n: 10
    element_subfield: id
    drop_source: true
  - array_col: procedure_codes
    prefix: proc_code
    n: 10
    element_subfield: null
    drop_source: true
  - array_col: diagnoses
    prefix: diagnosis_icd
    n: 10
    element_subfield: icd_code
    drop_source: true
  - array_col: medications
    prefix: medication
    n: 10
    element_subfield: name
    drop_source: true

strict_output_columns: false

performance:
  initial_partitions: 50            # smaller for dev (less data)
  partition_col: null
  output_partitions: 20
  output_partition_col: null

spark_conf:
  spark.sql.shuffle.partitions: "50"
  spark.sql.adaptive.enabled: "true"
  spark.serializer: "org.apache.spark.serializer.KryoSerializer"
  spark.sql.debug.maxToStringFields: "3000"

sink:
  format: "parquet"
  path: "gs://your-sink-bucket-dev/processed/xml_etl_output"
  mode: "overwrite"
  partition_by:
    - "year"
    - "month"
  options:
    compression: "snappy"
