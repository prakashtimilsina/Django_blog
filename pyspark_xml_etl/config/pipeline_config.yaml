# =============================================================================
# PySpark XML ETL Pipeline — Base Configuration
# =============================================================================
# This is the LOCAL / CI default config.
#
# For GCP environments, use the env-specific configs under config/env/:
#   config/env/dev.yaml   → deployed to gs://<bucket>/config/pipeline_config_dev.yaml
#   config/env/qa.yaml    → deployed to gs://<bucket>/config/pipeline_config_qa.yaml
#   config/env/prod.yaml  → deployed to gs://<bucket>/config/pipeline_config_prod.yaml
#
# The Airflow DAG automatically selects the correct GCS config at runtime.
# Run locally:
#   spark-submit --packages com.databricks:spark-xml_2.12:0.17.0 \
#       src/etl_pipeline.py --config config/pipeline_config.yaml
# =============================================================================

app_name: "XMLETLPipeline"
env: "local"

# ── Spark tuning ──────────────────────────────────────────────────────────────
spark_conf:
  spark.sql.shuffle.partitions: "800"
  spark.sql.adaptive.enabled: "true"
  spark.sql.adaptive.coalescePartitions.enabled: "true"
  spark.sql.adaptive.skewJoin.enabled: "true"
  spark.serializer: "org.apache.spark.serializer.KryoSerializer"
  spark.sql.debug.maxToStringFields: "3000"
  spark.sql.autoBroadcastJoinThreshold: "-1"

# ── Source ────────────────────────────────────────────────────────────────────
# GCS path for GCP environments (set in config/env/*.yaml).
# For local testing point at the sample fixture.
source:
  path: "tests/fixtures/sample_records.xml"
  row_tag: "record"
  reader_options:
    charset: "UTF-8"
    treatEmptyValuesAsNulls: "true"
    attributePrefix: "attr_"
    valueTag: "_value"

# ── Schema ────────────────────────────────────────────────────────────────────
# On GCP Dataproc this path is a gs:// URI (see config/env/*.yaml).
schema:
  path: "config/schema_config.json"

# ── Data quality ──────────────────────────────────────────────────────────────
quality:
  max_corrupt_records: 100

# ── Transformation ────────────────────────────────────────────────────────────
flatten_structs: true

pivot_specs:
  - array_col: teeth
    prefix: tooth_id
    n: 10
    element_subfield: id
    drop_source: true
  - array_col: procedure_codes
    prefix: proc_code
    n: 10
    element_subfield: null
    drop_source: true
  - array_col: diagnoses
    prefix: diagnosis_icd
    n: 10
    element_subfield: icd_code
    drop_source: true
  - array_col: medications
    prefix: medication
    n: 10
    element_subfield: name
    drop_source: true

strict_output_columns: false

# ── Performance ───────────────────────────────────────────────────────────────
performance:
  initial_partitions: 400
  partition_col: null
  output_partitions: 200
  output_partition_col: null

# ── Sink ──────────────────────────────────────────────────────────────────────
# GCS path for GCP environments (set in config/env/*.yaml).
sink:
  format: "parquet"
  path: "/tmp/xml_etl_local_output"
  mode: "overwrite"
  partition_by:
    - "year"
    - "month"
  options:
    compression: "snappy"
